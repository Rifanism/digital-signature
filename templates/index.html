<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Signature System</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 650px;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            font-size: 1.2rem;
        }
        .section {
            background-color: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-weight: bold;
            font-size: 0.9em;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px dashed #475569;
            border-radius: 4px;
            background-color: #0f172a;
            color: #f8fafc;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 4px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #38bdf8;
            font-family: inherit;
            box-sizing: border-box;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: inherit;
            width: 100%;
            margin-bottom: 1rem;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        
        .badge {
            display: block;
            text-align: center;
            padding: 0.75rem;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 1rem;
        }
        .valid {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid #10b981;
        }
        .invalid {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>[01] Initialization</h2>
    <div class="section">
        <button onclick="generateKeys()">Generate RSA Keys</button>
        <p id="keyStatus" style="color: #94a3b8; font-size: 0.85em; text-align: center; margin-bottom: 0;"></p>
    </div>

    <h2>[02] Sign File</h2>
    <div class="section">
        <label>Pilih File yang Akan Ditandatangani:</label>
        <input type="file" id="fileSign">
        <button onclick="signFile()">Sign Document</button>
        
        <label style="margin-top: 1rem;">Copy Digital Signature:</label>
        <textarea id="sigOutput" rows="4" readonly placeholder="Signature akan muncul di sini..."></textarea>
    </div>

    <h2>[03] Verify File</h2>
    <div class="section">
        <label>Pilih File Asli:</label>
        <input type="file" id="fileVerify">
        
        <label>Paste Digital Signature:</label>
        <textarea id="sigInput" rows="4" placeholder="Tempel signature di sini..."></textarea>
        
        <button onclick="verifyFile()" style="background-color: #a78bfa; color: #000;">Verify File Integrity</button>
        <div id="verifyResult"></div>
    </div>
</div>

<script>
    async function apiCall(url, formData) {
        const res = await fetch(url, { method: 'POST', body: formData });
        return res.json();
    }

    async function generateKeys() {
        try {
            document.getElementById('keyStatus').innerText = "Memproses...";
            const res = await fetch('/generate_keys', {method:'POST'});
            const data = await res.json();
            document.getElementById('keyStatus').innerText = "✓ " + data.status;
        } catch (err) {
            alert("Gagal menghubungi server.");
        }
    }

    async function signFile() {
        const file = document.getElementById('fileSign').files[0];
        if(!file) return alert("Pilih file dulu!");
        
        const fd = new FormData(); 
        fd.append('file', file);
        
        try {
            const data = await apiCall('/sign', fd);
            document.getElementById('sigOutput').value = data.signature || data.error;
        } catch (err) {
            alert("Kesalahan server.");
        }
    }

    async function verifyFile() {
        const file = document.getElementById('fileVerify').files[0];
        const sig = document.getElementById('sigInput').value.trim();
        const resDiv = document.getElementById('verifyResult');
        
        if(!file || !sig) return alert("File dan Signature harus diisi!");
        
        resDiv.innerHTML = "Memverifikasi...";
        
        const fd = new FormData(); 
        fd.append('file', file); fd.append('signature', sig);
        
        try {
            const data = await apiCall('/verify', fd);
            if(data.is_valid === true) {
                resDiv.innerHTML = `<div class="badge valid">✓ VALID.</div>`;
            } else {
                resDiv.innerHTML = `<div class="badge invalid">✗ INVALID.</div>`;
            }
        } catch (err) {
            resDiv.innerHTML = `<div class="badge invalid">✗ Error sistem verifikasi.</div>`;
        }
    }
</script>

</body>
</html>
